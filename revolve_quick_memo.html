<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173e39"><title>仕事メモ｜Revolve</title><style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",sans-serif;color:#1b302d;background:#f3f6f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:740px;margin:auto;padding:18px 15px 65px}header{background:#173e39;color:white;padding:25px 20px;border-radius:18px;margin-bottom:15px}h1{margin:0;font-size:24px}small,.sub{color:#74847f}.sub{color:#c5d7d0;font-size:13px;margin-top:5px}.card{background:white;border:1px solid #dfe7e2;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #193a3210}textarea{font:inherit;width:100%;min-height:96px;border:1px solid #ccd9d3;border-radius:12px;padding:13px;resize:vertical;font-size:17px}textarea:focus,input:focus{outline:2px solid #74ad9b}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#e8eeeb;color:#173e39}button.primary{background:#16654e;color:white;font-weight:700}button.danger{color:#9a2727}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #7fae9d}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}.tabs{display:flex;gap:6px;overflow-x:auto;padding:3px 0 8px}.tabs button{white-space:nowrap;font-size:13px}.tabs button.on{background:#173e39;color:white}.item{display:flex;align-items:flex-start;gap:10px;border-top:1px solid #e9eeeb;padding:14px 0}.item:first-of-type{border-top:0}.item input[type=checkbox]{width:23px;height:23px;accent-color:#16654e;flex-shrink:0}.itemtext{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}.meta{font-size:12px;color:#64756e;margin-top:5px}.late{color:#c43a35;font-weight:700}.done{text-decoration:line-through;color:#89938e}input[type=date],input[type=text]{font:inherit;padding:10px;border:1px solid #cbd7d1;border-radius:9px;max-width:100%}dialog{border:0;border-radius:16px;width:min(92vw,520px);padding:22px;box-shadow:0 20px 80px #0005}dialog::backdrop{background:#0007}dialog label{display:block;margin:14px 0 5px;font-size:13px;font-weight:700}dialog textarea{min-height:100px}details{margin-top:20px}details summary{cursor:pointer;font-weight:600}.hint{font-size:12px;color:#63756e;line-height:1.7}.count{font-size:13px;color:#60766e}.empty{text-align:center;padding:25px;color:#70837a}.toast{min-height:18px;color:#16654e;font-size:13px;margin-top:6px}@media(min-width:600px){.wrap{padding-top:26px}} 
</style></head><body><main class="wrap"><header><h1>仕事メモ</h1><div class="sub">思いついたら、書いて保存。それだけ。</div></header>
<section class="card"><label for="quick"><strong>今、忘れたくないこと</strong></label><div style="height:9px"></div><textarea id="quick" placeholder="例：トーカンのクロス屋に電話&#10;例：ゼストック見積を明日送る"></textarea><div class="row" style="margin-top:10px"><button class="primary grow" id="add">＋ メモを保存</button></div><div id="status" class="toast" role="status"></div><div class="hint">物件名・期限・優先度は入力不要。期限は後から付けられます。</div></section>
<section class="card"><div class="row" style="justify-content:space-between"><strong>やること</strong><span id="counter" class="count"></span></div><div class="tabs" id="tabs" style="margin-top:12px"></div><div id="items"></div></section>
<details class="card"><summary>バックアップ・データ移行</summary><p class="hint">データはこのブラウザにのみ保存されます。別の端末には自動同期されません。定期的にバックアップしてください。</p><div class="row"><button id="export">バックアップ保存</button><button id="importButton">バックアップ読込</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></details>
<p class="hint">現在はオフラインで使える試作版です。LINE通知・PCとiPhoneの同期・AIによる期限解析は未実装です。運転中は操作しないでください。</p></main>
<dialog id="editDialog"><form method="dialog" id="editForm"><h3>メモを編集</h3><label for="editText">内容</label><textarea id="editText" required></textarea><label for="editDue">期限（任意）</label><input type="date" id="editDue"><div class="row" style="margin-top:20px"><button value="cancel">キャンセル</button><button type="button" class="danger" id="delete">削除</button><button class="primary grow" value="save">保存</button></div></form></dialog>
<script>
(()=>{'use strict';const KEY='revolve_quick_capture_v1',OLD='revolve_tasks_prototype_v1';const $=id=>document.getElementById(id);const iso=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};let tasks=[],tab='today',editing=null;try{const saved=localStorage.getItem(KEY);if(saved){tasks=JSON.parse(saved)}else{const old=JSON.parse(localStorage.getItem(OLD)||'[]');if(Array.isArray(old)&&old.length){tasks=old.map(t=>({id:String(t.id),text:String(t.name||''),due:t.due||'',done:!!t.done,created:t.created||new Date().toISOString()}));localStorage.setItem(KEY,JSON.stringify(tasks))}}if(!Array.isArray(tasks))tasks=[]}catch{tasks=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));render();return true}catch{$('status').textContent='保存できません。ブラウザの空き容量や設定を確認してください。';return false}}
function render(){const today=iso(),tomorrow=iso(1);const tabs=[['today','今日・期限超過'],['inbox','期限なし'],['tomorrow','明日'],['all','未完了すべて'],['done','完了履歴']];$('tabs').innerHTML=tabs.map(([id,label])=>`<button data-tab="${id}" class="${id===tab?'on':''}">${label}</button>`).join('');const open=tasks.filter(t=>!t.done);$('counter').textContent=`未完了 ${open.length}件`;let filtered=tasks.filter(t=>tab==='done'?t.done:!t.done&&(tab==='today'?t.due&&t.due<=today:tab==='inbox'?!t.due:tab==='tomorrow'?t.due===tomorrow:true));filtered.sort((a,b)=>{const ad=a.due||'9999',bd=b.due||'9999';return ad.localeCompare(bd)||String(b.created).localeCompare(String(a.created))});const list=$('items');list.replaceChildren();if(!filtered.length){const e=document.createElement('div');e.className='empty';e.textContent=tab==='today'?'今日が期限のタスク・期限超過はありません':'この一覧にタスクはありません';list.append(e)}for(const t of filtered){const el=document.createElement('div');el.className='item';const cb=document.createElement('input');cb.type='checkbox';cb.checked=t.done;cb.setAttribute('aria-label','完了');cb.onchange=()=>{t.done=cb.checked;save()};const content=document.createElement('div');content.className='grow';const name=document.createElement('div');name.className='itemtext'+(t.done?' done':'');name.textContent=t.text;const meta=document.createElement('div');meta.className='meta'+(!t.done&&t.due&&t.due<today?' late':'');meta.textContent=t.due?(!t.done&&t.due<today?'期限超過・':'期限：')+t.due:'期限未設定';content.append(name,meta);const edit=document.createElement('button');edit.textContent='編集';edit.setAttribute('aria-label',t.text+'を編集');edit.onclick=()=>{editing=t.id;$('editText').value=t.text;$('editDue').value=t.due||'';$('editDialog').showModal()};el.append(cb,content,edit);list.append(el)}}
$('add').onclick=()=>{const text=$('quick').value.trim();if(!text){$('quick').focus();return}tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),text,due:'',done:false,created:new Date().toISOString()});if(save()){$('quick').value='';$('status').textContent='保存しました（期限なし）';tab='inbox';render();$('quick').focus()}};$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};$('editDialog').addEventListener('close',()=>{if($('editDialog').returnValue!=='save')return;const t=tasks.find(t=>t.id===editing);if(t&&$('editText').value.trim()){t.text=$('editText').value.trim();t.due=$('editDue').value;save()}});$('delete').onclick=()=>{if(confirm('このメモを削除しますか？')){tasks=tasks.filter(t=>t.id!==editing);save();$('editDialog').close('cancel')}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,tasks,exported:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='revolve_tasks_backup_'+iso()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};$('importButton').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text()),arr=Array.isArray(parsed)?parsed:parsed.tasks;if(!Array.isArray(arr)||!arr.every(t=>t&&typeof t.text==='string'))throw Error('format');if(!confirm('現在のメモをバックアップの内容で置き換えます。よろしいですか？'))return;tasks=arr.map(t=>({id:String(t.id||Math.random()),text:t.text,due:t.due||'',done:!!t.done,created:t.created||new Date().toISOString()}));save()}catch{alert('読み込めないバックアップファイルです')}finally{e.target.value=''}};render()})();
</script></body></html>
